<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390"
     fill="none" stroke="#b8c4ff" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">

  <!-- ══ 1. BIG TIERED CAKE — top-left, tilted -18° ══ -->
  <g transform="translate(52,88) rotate(-18)">
    <rect x="-30" y="12"  width="60" height="20" rx="3"/>
    <rect x="-24" y="-8"  width="48" height="20" rx="3"/>
    <rect x="-17" y="-27" width="34" height="19" rx="3"/>
    <!-- candle arc + flame -->
    <path d="M-11,-27 C-11,-34 -5,-39 0,-39 C5,-39 11,-34 11,-27"/>
    <circle cx="0" cy="-41" r="3"/>
    <!-- dots on tiers -->
    <circle cx="-16" cy="3"  r="2.2" fill="#b8c4ff"/>
    <circle cx="0"   cy="3"  r="2.2" fill="#b8c4ff"/>
    <circle cx="16"  cy="3"  r="2.2" fill="#b8c4ff"/>
    <circle cx="-10" cy="-16" r="1.8" fill="#b8c4ff"/>
    <circle cx="10"  cy="-16" r="1.8" fill="#b8c4ff"/>
    <!-- base scallop -->
    <path d="M-28,32 Q-14,37 0,32 Q14,37 28,32"/>
  </g>

  <!-- ══ 2. CUPCAKE — upper-centre, tilted +22° ══ -->
  <g transform="translate(248,52) rotate(22)">
    <!-- cup body -->
    <path d="M-23,24 L-18,46 L18,46 L23,24 Z"/>
    <!-- frosting base -->
    <path d="M-25,24 C-25,24 -22,9 -14,5 C-9,3 -6,7 0,7 C6,7 9,3 14,5 C22,9 25,24 25,24"/>
    <!-- frosting swirl top -->
    <path d="M-18,7 C-18,0 -14,-5 -10,-6 C-6,-10 6,-10 10,-6 C14,-5 18,0 18,7"/>
    <!-- sprinkles/dots -->
    <circle cx="-9" cy="-8" r="2.2" fill="#b8c4ff"/>
    <circle cx="9"  cy="-9" r="1.6" fill="#b8c4ff"/>
    <circle cx="1"  cy="-13" r="1.4" fill="#b8c4ff"/>
    <!-- cup lines -->
    <path d="M-21,36 Q0,40 21,36"/>
    <line x1="-14" y1="26" x2="14" y2="26"/>
  </g>

  <!-- ══ 3. SINGLE-LAYER CAKE with HEART — right side, tilted -26° ══ -->
  <g transform="translate(448,92) rotate(-26)">
    <rect x="-32" y="10"  width="64" height="22" rx="3"/>
    <rect x="-26" y="-9"  width="52" height="19" rx="3"/>
    <!-- frosting drip top -->
    <path d="M-22,-9 C-22,-16 -17,-22 -12,-22 C-6,-22 0,-15 0,-15 C0,-15 6,-22 12,-22 C17,-22 22,-16 22,-9"/>
    <!-- heart on very top -->
    <path d="M-5,-28 C-5,-32 -9,-35 -12,-32 C-15,-29 -12,-25 -5,-21 C2,-25 5,-29 2,-32 C-1,-35 -5,-32 -5,-28Z"
          stroke-width="1.3"/>
    <!-- dots -->
    <circle cx="-17" cy="21" r="2" fill="#b8c4ff"/>
    <circle cx="0"   cy="21" r="2" fill="#b8c4ff"/>
    <circle cx="17"  cy="21" r="2" fill="#b8c4ff"/>
    <path d="M-30,32 Q0,37 30,32"/>
  </g>

  <!-- ══ 4. CAKE SLICE (wedge) — mid-left, tilted +40° ══ -->
  <g transform="translate(98,218) rotate(40)">
    <path d="M0,-30 L24,12 L-24,12 Z"/>
    <path d="M-24,12 Q0,18 24,12"/>
    <!-- cream layer -->
    <path d="M-16,-8 Q0,-3 16,-8"/>
    <circle cx="0"  cy="-16" r="2.4" fill="#b8c4ff"/>
    <circle cx="-6" cy="-4"  r="1.5" fill="#b8c4ff"/>
    <circle cx="6"  cy="-4"  r="1.5" fill="#b8c4ff"/>
  </g>

  <!-- ══ 5. CHERRY PAIR — lower-left, tilted -12° ══ -->
  <g transform="translate(162,305) rotate(-12)">
    <circle cx="-9" cy="9"  r="7" stroke-width="1.4"/>
    <circle cx="9"  cy="5"  r="7" stroke-width="1.4"/>
    <!-- stems -->
    <path d="M-4,2 C-4,-5 0,-12 5,-16" stroke-width="1.3"/>
    <path d="M14,-2 C14,-8 11,-13 5,-16" stroke-width="1.3"/>
    <!-- leaf -->
    <path d="M5,-16 C8,-20 14,-19 13,-15" stroke-width="1.2"/>
  </g>

  <!-- ══ 6. SMALL TIERED CAKE — lower-centre, tilted +28° ══ -->
  <g transform="translate(325,298) rotate(28)">
    <rect x="-22" y="8"  width="44" height="16" rx="2.5"/>
    <rect x="-17" y="-8" width="34" height="16" rx="2.5"/>
    <rect x="-12" y="-22" width="24" height="14" rx="2.5"/>
    <path d="M-7,-22 C-7,-27 -3,-31 0,-31 C3,-31 7,-27 7,-22"/>
    <circle cx="0" cy="-33" r="2.2"/>
    <circle cx="-11" cy="17" r="1.6" fill="#b8c4ff"/>
    <circle cx="11"  cy="17" r="1.6" fill="#b8c4ff"/>
    <path d="M-20,24 Q0,28 20,24"/>
  </g>

  <!-- ══ 7. SMALL CUPCAKE — lower-right, tilted -34° ══ -->
  <g transform="translate(488,272) rotate(-34)">
    <path d="M-18,20 L-14,36 L14,36 L18,20 Z"/>
    <path d="M-20,20 C-20,20 -18,9 -11,6 C-7,4 -4,7 0,7 C4,7 7,4 11,6 C18,9 20,20 20,20"/>
    <path d="M-14,7 C-14,1 -11,-3 -7,-5 C-4,-8 4,-8 7,-5 C11,-3 14,1 14,7"/>
    <circle cx="-6"  cy="-7" r="1.8" fill="#b8c4ff"/>
    <circle cx="6"   cy="-9" r="1.4" fill="#b8c4ff"/>
    <path d="M-16,28 Q0,32 16,28"/>
  </g>

  <!-- ══ 8. MUFFIN / CUPCAKE — far-left edge, tilted +15° ══ -->
  <g transform="translate(8,165) rotate(15)">
    <path d="M-16,18 L-12,34 L12,34 L16,18 Z"/>
    <path d="M-18,18 C-18,18 -16,7 -10,4 C-7,2 -4,5 0,5 C4,5 7,2 10,4 C16,7 18,18 18,18"/>
    <path d="M-12,5 C-12,-1 -9,-5 -6,-6 C-3,-9 3,-9 6,-6 C9,-5 12,-1 12,5"/>
    <circle cx="0" cy="-8" r="1.8" fill="#b8c4ff"/>
  </g>

  <!-- ══ 9. LARGE STAR — upper-right area ══ -->
  <g transform="translate(382,30) rotate(18)">
    <path d="M0,-14 L3.3,-5.1 L12.7,-5.1 L5.2,0 L8,9.4 L0,4 L-8,9.4 L-5.2,0 L-12.7,-5.1 L-3.3,-5.1Z"
          stroke-width="1.2"/>
  </g>

  <!-- ══ 10. MEDIUM STAR — mid-page left ══ -->
  <g transform="translate(172,42) rotate(8)">
    <path d="M0,-10 L2.4,-3.6 L9.1,-3.6 L3.8,-0 L5.8,6.8 L0,2.8 L-5.8,6.8 L-3.8,-0 L-9.1,-3.6 L-2.4,-3.6Z"
          stroke-width="1"/>
  </g>

  <!-- ══ 11. SMALL STAR — right edge ══ -->
  <g transform="translate(520,178) rotate(-22)">
    <path d="M0,-8 L1.9,-2.9 L7.3,-2.9 L3,-0 L4.7,5.5 L0,2.3 L-4.7,5.5 L-3,-0 L-7.3,-2.9 L-1.9,-2.9Z"
          stroke-width="0.9"/>
  </g>

  <!-- ══ 12. TINY STAR — scattered ══ -->
  <g transform="translate(295,148) rotate(35)">
    <path d="M0,-6 L1.4,-2.1 L5.5,-2.1 L2.3,0 L3.5,4 L0,1.7 L-3.5,4 L-2.3,0 L-5.5,-2.1 L-1.4,-2.1Z"
          stroke-width="0.8"/>
  </g>

  <!-- ══ 13. Scattered dots ══ -->
  <circle cx="135" cy="155" r="2.2" fill="#b8c4ff" stroke="none"/>
  <circle cx="358" cy="195" r="1.6" fill="#b8c4ff" stroke="none"/>
  <circle cx="475" cy="145" r="1.9" fill="#b8c4ff" stroke="none"/>
  <circle cx="22"  cy="58"  r="1.6" fill="#b8c4ff" stroke="none"/>
  <circle cx="272" cy="178" r="2"   fill="#b8c4ff" stroke="none"/>
  <circle cx="55"  cy="320" r="1.6" fill="#b8c4ff" stroke="none"/>
  <circle cx="418" cy="340" r="2"   fill="#b8c4ff" stroke="none"/>
  <circle cx="225" cy="358" r="1.6" fill="#b8c4ff" stroke="none"/>
  <circle cx="500" cy="50"  r="1.4" fill="#b8c4ff" stroke="none"/>
  <circle cx="540" cy="300" r="1.8" fill="#b8c4ff" stroke="none"/>
  <circle cx="78"  cy="128" r="1.4" fill="#b8c4ff" stroke="none"/>
  <circle cx="440" cy="200" r="1.4" fill="#b8c4ff" stroke="none"/>

</svg>
